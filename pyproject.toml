[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-earnings_analyst"
version = "0.1.0"
description = "Earnings Analyst environment for OpenEnv"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "huggingface-hub>=1.10.1",
    "openai>=2.31.0",
    "openenv-core[core]>=0.2.2",
    "python-dotenv>=1.2.2",
    "gradio>=4.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m earnings_analyst.server.app
server = "earnings_analyst.server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "earnings_analyst",
    "earnings_analyst.server",
    "earnings_analyst.tasks",
    "earnings_analyst.tasks.get_figures",
    "earnings_analyst.tasks.sentiment_label",
    "earnings_analyst.tasks.next_quarter_move",
    "earnings_analyst.tasks.one_day_move",
    "earnings_analyst.tasks.thirty_day_move",
]
# Root of this repo is the `earnings_analyst` package (setuptools package-dir `.`).
package-dir = { "earnings_analyst" = ".", "earnings_analyst.server" = "server", "earnings_analyst.tasks" = "tasks", "earnings_analyst.tasks.get_figures" = "tasks/get_figures", "earnings_analyst.tasks.sentiment_label" = "tasks/sentiment_label", "earnings_analyst.tasks.next_quarter_move" = "tasks/next_quarter_move", "earnings_analyst.tasks.one_day_move" = "tasks/one_day_move", "earnings_analyst.tasks.thirty_day_move" = "tasks/thirty_day_move" }

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = ".venv"
extraPaths = [".."]
